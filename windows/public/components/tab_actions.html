<div class="settings-section">
  <h2 class="settings-section-title">Video Control</h2>
  <div class="actions-grid">
    <button class="action-card" id="btn-reconnect" onclick="Stream.reconnect()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.73-3.24"/></svg>
      <span>Reconnect</span>
      <span class="action-desc">Restart FFmpeg Pipeline</span>
    </button>

    <button class="action-card" id="btn-snapshot" onclick="Stream.snapshot()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span>Snapshot</span>
      <span class="action-desc">Save frame as PNG</span>
    </button>

    <button class="action-card" id="btn-fullscreen" onclick="Stream.toggleFullscreen()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      <span>Fullscreen</span>
      <span class="action-desc">View feed in fullscreen</span>
    </button>

    <button class="action-card" id="btn-pip" onclick="Stream.togglePiP()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="12" y="10" width="8" height="5" rx="1"/></svg>
      <span>Picture-in-Picture</span>
      <span class="action-desc">Floating window overlay</span>
    </button>
  </div>
</div>

<div class="settings-section">
  <h2 class="settings-section-title">Recording</h2>
  <div class="setting-row">
    <div class="setting-info">
      <span class="setting-title">Record Stream</span>
      <span class="setting-desc">Save lossless H.264 stream to MP4</span>
    </div>
    <button class="ctrl-btn ctrl-btn--record" id="btn-record" onclick="Stream.toggleRecording()">
      <span class="record-dot" id="record-dot"></span>
      <span id="record-label">Record</span>
    </button>
  </div>
</div>
