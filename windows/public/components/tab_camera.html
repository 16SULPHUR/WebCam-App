<div class="settings-section">
  <h2 class="settings-section-title">Video Format & Output</h2>

  <!-- Resolution -->
  <div class="ctrl-group">
    <label class="ctrl-label" for="resolution-select">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      Resolution
    </label>
    <select id="resolution-select" class="ctrl-select" onchange="Config.update()">
      <option value="auto">Auto (720p)</option>
      <option value="640x360">640 x 360</option>
      <option value="640x480">640 x 480</option>
      <option value="960x540">960 x 540</option>
      <option value="1280x720">1280 x 720</option>
      <option value="1280x960">1280 x 960</option>
      <option value="1920x1080">1920 x 1080</option>
    </select>
  </div>

  <!-- Zoom -->
  <div class="ctrl-group">
    <label class="ctrl-label" for="zoom-select">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      Hardware Zoom
    </label>
    <div class="zoom-slider-container">
      <input type="range" id="zoom-select" min="1.0" max="3.0" step="0.1" value="1.0" class="ctrl-range" oninput="Config.onZoomChange(this.value)">
      <span id="zoom-val" class="ctrl-val">1.0x</span>
    </div>
  </div>

  <!-- Orientation -->
  <div class="ctrl-group">
    <label class="ctrl-label" for="orientation-select">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
      Orientation
    </label>
    <select id="orientation-select" class="ctrl-select" onchange="Config.onOrientationChange()">
      <option value="0">Normal (0°)</option>
      <option value="90">Rotate 90° CW</option>
      <option value="180">Rotate 180°</option>
      <option value="270">Rotate 270° CW</option>
    </select>
  </div>
</div>

<div class="settings-section">
  <h2 class="settings-section-title">Device Features</h2>

  <!-- Mirror -->
  <div class="setting-row">
    <div class="setting-info">
      <span class="setting-title">Mirror Feed</span>
      <span class="setting-desc">Flip the video feed horizontally</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="mirror-checkbox" onchange="Config.update()">
      <span class="slider"></span>
    </label>
  </div>

  <!-- Virtual Cam -->
  <div class="setting-row">
    <div class="setting-info">
      <span class="setting-title">OBS Virtual Camera</span>
      <span class="setting-desc">Register video device on Windows</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="vcam-checkbox" checked onchange="Config.update()">
      <span class="slider"></span>
    </label>
  </div>
</div>

<!-- Video Processing section -->
<div class="settings-section">
  <h2 class="settings-section-title">Video Processing</h2>
  <p class="settings-section-desc">Applied via FFmpeg - affects VCam &amp; web preview</p>
  <div class="ctrl-group">
    <label class="ctrl-label" for="fps-select">FPS Throttle</label>
    <select id="fps-select" class="ctrl-select" onchange="Config.onProcessingChange()">
      <option value="10">10 fps</option>
      <option value="15">15 fps</option>
      <option value="20">20 fps</option>
      <option value="24">24 fps</option>
      <option value="30" selected>30 fps (max)</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label class="ctrl-label" for="brightness-range">Brightness</label>
    <div class="zoom-slider-container">
      <input type="range" id="brightness-range" min="-1.0" max="1.0" step="0.05" value="0.0" class="ctrl-range" oninput="Config.onProcessingChange()">
      <span id="brightness-val" class="ctrl-val">0.0</span>
    </div>
  </div>
  <div class="ctrl-group">
    <label class="ctrl-label" for="contrast-range">Contrast</label>
    <div class="zoom-slider-container">
      <input type="range" id="contrast-range" min="0.5" max="2.0" step="0.05" value="1.0" class="ctrl-range" oninput="Config.onProcessingChange()">
      <span id="contrast-val" class="ctrl-val">1.0</span>
    </div>
  </div>
  <div class="ctrl-group">
    <label class="ctrl-label" for="saturation-range">Saturation</label>
    <div class="zoom-slider-container">
      <input type="range" id="saturation-range" min="0.0" max="2.0" step="0.05" value="1.0" class="ctrl-range" oninput="Config.onProcessingChange()">
      <span id="saturation-val" class="ctrl-val">1.0</span>
    </div>
  </div>
  <div class="ctrl-group">
    <label class="ctrl-label" for="sharpness-range">Sharpness</label>
    <div class="zoom-slider-container">
      <input type="range" id="sharpness-range" min="0.0" max="2.0" step="0.1" value="0.0" class="ctrl-range" oninput="Config.onProcessingChange()">
      <span id="sharpness-val" class="ctrl-val">0.0</span>
    </div>
  </div>
  <div class="ctrl-group">
    <label class="ctrl-label" for="blur-range">Background Blur</label>
    <div class="zoom-slider-container">
      <input type="range" id="blur-range" min="0" max="25" step="1" value="0" class="ctrl-range" oninput="Config.onProcessingChange()">
      <span id="blur-val" class="ctrl-val">Off</span>
    </div>
  </div>
  <button class="ctrl-btn" onclick="Config.resetProcessing()" style="font-size:12px;padding:6px 12px;margin-top:4px;">&#8635; Reset to Defaults</button>
</div>
