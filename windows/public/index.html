<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USB Webcam Bridge - Dashboard</title>
  <meta name="description" content="Live stream control dashboard for USB Webcam Bridge - monitor, configure, and control your Android phone camera feed in real time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/terminal.css">
</head>
<body>

  <!-- Header Section (Loaded Dynamically) -->
  <header id="app-header" data-component="header"></header>

  <!-- Main Grid (Split Layout) -->
  <main id="app-main">

    <!-- Left sidebar containing tabs -->
    <aside id="settings-panel">
      <!-- Tabs Navigation Header -->
      <nav class="settings-nav">
        <button class="nav-tab active" data-tab="camera" title="Camera Settings">Camera</button>
        <button class="nav-tab" data-tab="actions" title="Quick Actions">Actions</button>
        <button class="nav-tab" data-tab="logs" title="System Logs">Logs</button>
      </nav>

      <!-- Tab Contents Container -->
      <div class="tab-container">
        <!-- Tab 1: Camera settings (Loaded Dynamically) -->
        <div class="tab-content active" id="tab-camera" data-component="tab_camera"></div>

        <!-- Tab 2: Actions (Loaded Dynamically) -->
        <div class="tab-content" id="tab-actions" data-component="tab_actions"></div>

        <!-- Tab 3: Logs (Loaded Dynamically) -->
        <div class="tab-content" id="tab-logs" data-component="tab_logs"></div>
      </div>
    </aside>

    <!-- Right: Video Feed Column (Loaded Dynamically) -->
    <section id="preview-panel" data-component="preview"></section>

  </main>

  <!-- Hidden video for PiP support -->
  <video id="pip-video" style="display:none;" autoplay muted playsinline></video>

  <!-- Core JavaScript Modules -->
  <script src="js/terminal.js"></script>
  <script src="js/stream.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
