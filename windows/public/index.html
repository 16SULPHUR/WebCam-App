<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USB Webcam Bridge — Dashboard</title>
  <meta name="description" content="Live stream control dashboard for USB Webcam Bridge — monitor, configure, and control your Android phone camera feed in real time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/terminal.css">
</head>
<body>

  <!-- ═══ HEADER ════════════════════════════════════════════════════════════ -->
  <header id="app-header">
    <div class="logo-container">
      <div class="logo-icon" id="logo-pulse"></div>
      <h1>USB Webcam Bridge</h1>
    </div>
    <div class="header-right">
      <div class="stat-badge" title="H.264 data received">
        <span class="stat-badge-label">H.264 IN</span>
        <span class="stat-badge-val accent-emerald" id="hdr-h264">0 KB</span>
      </div>
      <div class="stat-badge" title="Decoded frames">
        <span class="stat-badge-label">FRAMES</span>
        <span class="stat-badge-val accent-cyan" id="hdr-frames">0</span>
      </div>
      <div class="stat-badge" title="Estimated FPS">
        <span class="stat-badge-label">FPS</span>
        <span class="stat-badge-val accent-orange" id="hdr-fps">--</span>
      </div>
      <canvas id="fps-sparkline" width="80" height="28" title="FPS history"></canvas>
      <div class="status-badge">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Disconnected</span>
      </div>
    </div>
  </header>

  <!-- ═══ CONTROLS BAR ═════════════════════════════════════════════════════ -->
  <section id="controls-bar">
    <div class="controls-inner">

      <!-- Resolution -->
      <div class="ctrl-group">
        <label class="ctrl-label" for="resolution-select">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          Resolution
        </label>
        <select id="resolution-select" class="ctrl-select" onchange="Config.update()">
          <option value="auto">Auto (720p)</option>
          <option value="640x360">640 × 360</option>
          <option value="640x480">640 × 480</option>
          <option value="960x540">960 × 540</option>
          <option value="1280x720">1280 × 720</option>
          <option value="1280x960">1280 × 960</option>
          <option value="1920x1080">1920 × 1080</option>
        </select>
      </div>

      <!-- Orientation (CSS only, instant preview - no restart needed) -->
      <div class="ctrl-group">
        <label class="ctrl-label" for="orientation-select">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
          Orientation
        </label>
        <select id="orientation-select" class="ctrl-select" onchange="Config.onOrientationChange()">
          <option value="0">Normal (0°)</option>
          <option value="90">Rotate 90° CW</option>
          <option value="180">Rotate 180°</option>
          <option value="270">Rotate 270° CW</option>
        </select>
      </div>

      <!-- Mirror -->
      <div class="ctrl-group ctrl-group--toggle">
        <label class="ctrl-label" for="mirror-checkbox">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="3" x2="12" y2="21"/><path d="M8 7 3 12l5 5"/><path d="M16 7l5 5-5 5"/></svg>
          Mirror
        </label>
        <label class="switch">
          <input type="checkbox" id="mirror-checkbox" onchange="Config.update()">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Virtual Cam -->
      <div class="ctrl-group ctrl-group--toggle">
        <label class="ctrl-label" for="vcam-checkbox">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          VCam
        </label>
        <label class="switch">
          <input type="checkbox" id="vcam-checkbox" checked onchange="Config.update()">
          <span class="slider"></span>
        </label>
      </div>

      <div class="ctrl-separator"></div>

      <!-- Reconnect -->
      <button class="ctrl-btn ctrl-btn--primary" id="btn-reconnect" onclick="Stream.reconnect()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.73-3.24"/></svg>
        Reconnect
      </button>

      <!-- Snapshot -->
      <button class="ctrl-btn" id="btn-snapshot" onclick="Stream.snapshot()" title="Save current frame as PNG">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Snapshot
      </button>

      <!-- Record -->
      <button class="ctrl-btn ctrl-btn--record" id="btn-record" onclick="Stream.toggleRecording()">
        <span class="record-dot" id="record-dot"></span>
        <span id="record-label">Record</span>
      </button>

      <!-- Fullscreen -->
      <button class="ctrl-btn" id="btn-fullscreen" onclick="Stream.toggleFullscreen()" title="Fullscreen feed (F11)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        Fullscreen
      </button>

      <!-- PiP -->
      <button class="ctrl-btn" id="btn-pip" onclick="Stream.togglePiP()" title="Picture-in-Picture">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="12" y="10" width="8" height="5" rx="1"/></svg>
        PiP
      </button>

      <!-- Toggle Console Visibility -->
      <button class="ctrl-btn" id="btn-toggle-console-visibility" onclick="Terminal.toggleVisibility()" title="Show/Hide Console Logs">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H4v-4h11v4zm0-5H4V9h11v4zm5 5h-4V9h4v9z"/></svg>
        <span>Console</span>
      </button>

    </div>
  </section>

  <!-- ═══ MAIN CONTENT ══════════════════════════════════════════════════════ -->
  <main id="app-main">

    <!-- Left: Video Feed -->
    <div id="feed-column">
      <div class="card" id="feed-card">
        <div class="card-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent-cyan)"><path d="M23 7a2 2 0 0 0-2.45-1.45L16 7V5a2 2 0 0 0-2-2H2a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2l4.55 1.45A2 2 0 0 0 23 17V7z"/></svg>
          Live Video Feed
          <span class="card-badge" id="feed-badge">OFFLINE</span>
          <!-- Record indicator -->
          <span class="rec-indicator" id="rec-indicator" style="display:none;">
            <span class="rec-dot-blink"></span> REC
          </span>
        </div>

        <div class="feed-container" id="feed-container">
          <div class="feed-placeholder" id="feed-placeholder">
            <div class="placeholder-icon">
              <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.2">
                <rect x="2" y="2" width="20" height="20" rx="2.18"/>
                <line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/>
                <line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/>
                <line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/>
                <line x1="17" y1="7" x2="22" y2="7"/>
              </svg>
            </div>
            <span>Waiting for H.264 stream…</span>
            <span class="placeholder-sub">Make sure ADB is connected and the bridge is running on your phone</span>
          </div>
          <!-- Feed image wrapped so CSS rotation doesn't overflow -->
          <div class="feed-img-wrapper" id="feed-img-wrapper">
            <img class="feed-img" id="feed-img" src="" style="display:none;" alt="Live Webcam Feed">
          </div>
          <!-- FPS overlay -->
          <div class="feed-overlay" id="feed-overlay" style="display:none;">
            <span id="overlay-fps">-- fps</span>
          </div>
        </div>

        <!-- Stream health -->
        <div id="stream-health">
          <div class="health-item">
            <span class="health-label">Signal</span>
            <div class="health-bar-track"><div class="health-bar-fill" id="health-signal" style="width:0%"></div></div>
          </div>
          <div class="health-item">
            <span class="health-label">Bitrate</span>
            <span class="health-val" id="health-bitrate">0 KB/s</span>
          </div>
          <div class="health-item">
            <span class="health-label">VCam</span>
            <span class="health-val" id="health-vcam" style="color:var(--accent-rose)">OFF</span>
          </div>
          <div class="health-item">
            <span class="health-label">REC</span>
            <span class="health-val" id="health-rec" style="color:var(--text-muted)">IDLE</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Console -->
    <div id="console-column">
      <div class="card terminal-card" id="terminal-card">

        <div class="terminal-header">
          <div class="card-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent-cyan)"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            Console Logs
            <span class="log-count-badge" id="log-count">0</span>
          </div>
          <div class="terminal-actions">
            <div class="filter-tabs" id="filter-tabs">
              <button class="filter-btn active" data-filter="all" onclick="Terminal.setFilter('all')">ALL</button>
              <button class="filter-btn" data-filter="android" onclick="Terminal.setFilter('android')">Android</button>
              <button class="filter-btn" data-filter="node" onclick="Terminal.setFilter('node')">Node</button>
              <button class="filter-btn" data-filter="python" onclick="Terminal.setFilter('python')">Python</button>
              <button class="filter-btn" data-filter="system" onclick="Terminal.setFilter('system')">System</button>
              <button class="filter-btn filter-btn--error" data-filter="error" onclick="Terminal.setFilter('error')">Errors</button>
            </div>
            <button class="icon-btn" onclick="Terminal.clear()" title="Clear logs">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
            <button class="icon-btn" id="btn-collapse-console" onclick="Terminal.toggleCollapse()" title="Collapse console">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="collapse-icon"><polyline points="18 15 12 9 6 15"/></svg>
            </button>
            <button class="icon-btn" id="btn-close-console" onclick="Terminal.toggleVisibility(false)" title="Close console (Hide completely)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>

        <div class="terminal-body" id="terminal"></div>

        <div class="terminal-footer">
          <label class="autoscroll-toggle">
            <input type="checkbox" id="autoscroll-cb" checked>
            <span>Auto-scroll</span>
          </label>
          <span class="terminal-info" id="terminal-info">0 lines</span>
        </div>

      </div>
    </div>

  </main>

  <!-- Hidden video for PiP support -->
  <video id="pip-video" style="display:none;" autoplay muted playsinline></video>

  <script src="js/terminal.js"></script>
  <script src="js/stream.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
