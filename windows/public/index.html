<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USB Webcam Bridge - Dashboard</title>
  <meta name="description" content="Live stream control dashboard for USB Webcam Bridge - monitor, configure, and control your Android phone camera feed in real time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/reactions.css">
</head>
<body>

  <!-- Header Section (Loaded Dynamically) -->
  <header id="app-header" data-component="header"></header>

  <!-- Hardware-Style Control Panel UI (Loaded Dynamically) -->
  <main id="app-main">
    <section id="controller-ui" data-component="controller"></section>
  </main>
  
  <!-- Reaction overlay settings dialog (Loaded Dynamically) -->
  <div id="reaction-settings" data-component="reactions"></div>

  <!-- Hidden video for PiP support -->
  <video id="pip-video" style="display:none;" autoplay muted playsinline></video>

  <!-- Core JavaScript Modules -->
  <script src="js/stream.js"></script>
  <script src="js/reactions.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
